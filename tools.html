<!DOCTYPE html>

<html lang="en">
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Climate+Crisis:YEAR@1979&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">        
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>My Tools | Matteo's Site</title>
        <style>
            html {
                cursor: url('assets/cursor.png'), default;
            }

            body {
                background-color: #000;
                color: #fff;
                margin: 0;
                padding: 0;
                
                width: 100%;
                height: 100vh;
                
                background-image: linear-gradient(rgba(55, 55, 55, .5) .1em, transparent .1em), linear-gradient(90deg, rgba(55, 55, 55, .5) .1em, transparent .1em);
                background-size: 3em 3em;
            }
                        
            h1 {
                text-align: center;
                font-family: 'Climate Crisis', sans-serif;
                color: #fff;
                font-size: 12vw;
                letter-spacing: 0.05em;
                line-height: 1;
                margin: 0;
                padding: 0;
            }

            p {
                text-align: center;
                font-family: 'Space Grotesk', monospace;
                font-size: 1.5vw;
                letter-spacing: 0.01em;
                line-height: 1.2;
                margin: 0;
                padding: 0;
            }

            a {
                text-decoration: none;
            }

            .main-container {
                box-sizing: border-box;
                width: 95%;
                margin: auto auto;
                columns: 3;
                column-gap: 0.5em;
                align-items: start;
                justify-items: center;
                gap: 0.5em;
                padding: 0.8em;
            }

            .item {
                box-sizing: border-box;
                color: #fff;
                background-color: #000;
                padding: 0.3em;
                gap: 0.3em;
                margin: 0 0 0.5em 0;
                width: 100%;
                text-align: center;
                border-radius: 15px;
                border: dashed 2px #fff;
                display: inline-block;
                break-inside: avoid;
            }

            .item:hover .card-title {
                font-size: 2.4vw;
                text-shadow: 0px 0px 8px currentColor;
            }
            

            .text-container {
                padding-top: 0.5vw;
                padding-bottom: 1vw;
                padding-right: 1vw;
                padding-left: 1vw;
            }

            .card-title {
                font-size: 2vw;
                transition-duration: 0.3s;
            }

            .image {
                border-radius: 8px;
                width: 100%;
                height: auto;
                display: block;
            }

            @media (max-width: 720px) {
                body {
                    background-size: 2em 2em;
                }

                .card-title {
                    font-size: 5vw;
                }

                .item:hover .card-title {
                    font-size: 5.8vw;
                    text-shadow: 0px 0px 8px currentColor;
                }

                p {
                    font-size: 4vw;
                }

                .main-container {
                    columns: 1;
                }

            }

        </style>
    </head>
    <body>
        <h1>MY TOOLS</h1>
        <div class="main-container">
            <a href="https://github.com/gtx-lover-69/mew-version-control" class="item">
                <img class="image" src="assets/mew.png">
                <div class="text-container">
                    <p class="card-title" style="color: #ffb4ce; font-weight: bold;">Mew</p>
                    <p>Git, but for Scratch.</p>
                </div>
            </a>
            <a href="https://github.com/gtx-lover-69/Matteo-CLI-FileTool" class="item">
                <img class="image" src="assets/filetool.png">
                <div class="text-container">
                    <p class="card-title" style="color: #0083fb; font-weight: bold;">FileTool</p>
                    <p>A CLI file reader/writer with file protection.</p>
                </div>
            </a>
            <a href="https://github.com/gtx-lover-69/Matteo-CLI-MusicTool" class="item">
                <img class="image" src="assets/musictool.png">
                <div class="text-container">
                    <p class="card-title" style="color: #0083fb; font-weight: bold;">MusicTool</p>
                    <p>A CLI music player.</p>
                </div>
            </a>
            <a href="https://github.com/gtx-lover-69/utilityhub" class="item">
                <img class="image" src="assets/suite.png">
                <div class="text-container">
                    <p class="card-title" style="color: #0083fb; font-weight: bold;">Utility Suite</p>
                    <p>A CLI Launcher app for all my tools.</p>
                </div>
            </a>
            <a href="https://github.com/gtx-lover-69/ZipPy" class="item">
                <img class="image" src="assets/zippy.png">
                <div class="text-container">
                    <p class="card-title" style="color: #efba2a; font-weight: bold;">ZipPy</p>
                    <p>A lightweight archive tool.</p>
                </div>
            </a>
        </div>
    </body>
</html>
